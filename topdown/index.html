<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>DARK ARENA TOPDOWN</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e13;color:#e6f2f4;font:14px system-ui;touch-action:none;user-select:none}canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#081018e8;z-index:10;text-align:center;padding:20px}.overlay.hide{display:none}h1{font-size:clamp(30px,6vw,64px);letter-spacing:.13em;margin:0}h1 span{color:#f05a4d}p{color:#b5c8cd;line-height:1.6}button{padding:15px 30px;border:0;background:#df4d46;color:white;font:bold 15px system-ui;cursor:pointer;border-radius:6px}#hud{position:fixed;left:12px;right:12px;top:8px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 3px black;font-weight:bold;letter-spacing:1px}#controls{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;pointer-events:none;padding:0 6%}.stick{width:100px;height:100px;border:2px solid #93cdd855;border-radius:50%;background:#90d6e018;position:relative;pointer-events:auto;touch-action:none}.nub{position:absolute;left:32px;top:32px;width:32px;height:32px;border-radius:50%;background:#b6e5ee99}#dash{position:fixed;right:36%;bottom:36px;pointer-events:auto;padding:13px 10px;background:#23434bbb;font-size:10px;z-index:2}#turn{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;text-align:center;background:#080e13;padding:24px}@media(orientation:portrait) and (pointer:coarse){#turn{display:flex}}@media(pointer:fine){#controls{display:none}#dash{display:none}}</style></head><body><canvas id="game"></canvas><div id="hud"><div>DARK <span style="color:#f05a4d">ARENA</span><div id="hp">ЗДОРОВЬЕ 100</div></div><div id="status">ВОЛНА 1/3 · 30 ПАТРОНОВ</div></div><div id="controls"><div class="stick" id="left"><div class="nub"></div></div><div class="stick" id="right"><div class="nub"></div></div></div><button id="dash">РЫВОК</button><div id="menu" class="overlay"><div><h1>DARK <span>ARENA</span></h1><p id="message">TOPDOWN · Тест мобильного управления<br>Левый джойстик — бег, правый — стрельба<br>На ПК: WASD и мышь</p><button id="play" type="button">НАЧАТЬ ИГРУ</button></div></div><div id="turn">Поверни телефон горизонтально ↻</div><script>(function(){'use strict';var c=document.getElementById('game'),ctx=c.getContext('2d'),menu=document.getElementById('menu'),play=document.getElementById('play'),msg=document.getElementById('message'),hp=document.getElementById('hp'),status=document.getElementById('status'),dash=document.getElementById('dash');var W=0,H=0,dpr=1,run=false,over=false,player={x:0,y:0,hp:100,a:0},wave=1,spawned=0,spawnTimer=0,between=0,ammo=30,reload=0,shot=0,inv=0,dashTime=0,dead=0,keys={},enemies=[],bullets=[],particles=[],mouse={x:0,y:0,down:false},sticks=[{x:0,y:0,id:null},{x:0,y:0,id:null}],last=0;function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=Math.floor(W*dpr);c.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function reset(){run=true;over=false;wave=1;spawned=0;spawnTimer=0;between=0;ammo=30;reload=0;shot=0;inv=0;dead=0;player={x:0,y:0,hp:100,a:0};enemies=[];bullets=[];particles=[];menu.classList.add('hide');play.textContent='ИГРАТЬ СНОВА';status.textContent='ВОЛНА 1/3'}function finish(win){run=false;over=true;msg.innerHTML=win?'Все три волны пройдены!':'Заражённые захватили заставу.';menu.classList.remove('hide')}play.addEventListener('click',reset);play.addEventListener('touchend',function(e){e.preventDefault();reset()},{passive:false});function joystick(el,i){function set(e){var b=el.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2),len=Math.hypot(dx,dy)||1,k=Math.min(1,len/36);sticks[i].x=dx/len*k;sticks[i].y=dy/len*k;el.firstElementChild.style.transform='translate('+sticks[i].x*29+'px,'+sticks[i].y*29+'px)'}el.addEventListener('pointerdown',function(e){e.preventDefault();sticks[i].id=e.pointerId;el.setPointerCapture(e.pointerId);set(e)});el.addEventListener('pointermove',function(e){if(sticks[i].id===e.pointerId)set(e)});function end(e){if(sticks[i].id!==e.pointerId)return;sticks[i].id=null;sticks[i].x=sticks[i].y=0;el.firstElementChild.style.transform=''}el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}joystick(document.getElementById('left'),0);joystick(document.getElementById('right'),1);dash.addEventListener('pointerdown',function(e){e.preventDefault();dashTime=.18});addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;if(e.key===' ')dashTime=.18;if(e.key.toLowerCase()==='r'&&ammo<30)reload=1.3});addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});c.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse')mouse.down=true});c.addEventListener('pointerup',function(){mouse.down=false});c.addEventListener('pointermove',function(e){mouse.x=e.clientX;mouse.y=e.clientY});function shoot(){if(shot>0||reload>0||ammo<=0)return;ammo--;shot=.12;var a=player.a+(Math.random()-.5)*.085;bullets.push({x:player.x+Math.cos(a)*18,y:player.y+Math.sin(a)*18,vx:Math.cos(a)*780,vy:Math.sin(a)*780,t:.9});if(ammo===0)reload=1.35}function spawn(){var a=Math.random()*Math.PI*2,d=370+Math.random()*140,type=Math.random();enemies.push({x:player.x+Math.cos(a)*d,y:player.y+Math.sin(a)*d,r:type>.86?19:13,h:type>.86?95:45,s:type>.86?44:type<.3?125:73,hit:0,at:0})}function step(dt){if(!run)return;inv=Math.max(0,inv-dt);shot=Math.max(0,shot-dt);if(reload>0){reload-=dt;if(reload<=0)ammo=30}var vx=sticks[0].id!==null?sticks[0].x:(keys.d?1:0)-(keys.a?1:0),vy=sticks[0].id!==null?sticks[0].y:(keys.s?1:0)-(keys.w?1:0),len=Math.hypot(vx,vy)||1,speed=dashTime>0?560:210;player.x+=vx/len*speed*dt;player.y+=vy/len*speed*dt;player.x=Math.max(-750,Math.min(750,player.x));player.y=Math.max(-560,Math.min(560,player.y));dashTime=Math.max(0,dashTime-dt);var ax=sticks[1].x,ay=sticks[1].y;if(sticks[1].id!==null&&Math.hypot(ax,ay)>.2){player.a=Math.atan2(ay,ax);shoot()}else if(mouse.down){player.a=Math.atan2(mouse.y-H/2,mouse.x-W/2);shoot()}else if(mouse.x&&mouse.y&&matchMedia('(pointer:fine)').matches){player.a=Math.atan2(mouse.y-H/2,mouse.x-W/2)}if(spawned<wave*3+4){spawnTimer-=dt;if(spawnTimer<=0){spawn();spawned++;spawnTimer=.67}}else if(enemies.length===0){between+=dt;if(between>1.8){if(wave===3){finish(true);return}wave++;spawned=0;between=0;spawnTimer=.7}}for(var i=bullets.length-1;i>=0;i--){var b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;var gone=b.t<=0;for(var j=enemies.length-1;j>=0&&!gone;j--){var e=enemies[j];if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+4){e.h-=35;e.hit=.12;gone=true;if(e.h<=0){enemies.splice(j,1);dead++}}}if(gone)bullets.splice(i,1)}for(var e of enemies){e.hit=Math.max(0,e.hit-dt);e.at=Math.max(0,e.at-dt);var dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;if(d>e.r+19){e.x+=dx/d*e.s*dt;e.y+=dy/d*e.s*dt}else if(e.at===0&&inv===0){e.at=1;e.at=1;inv=.65;player.hp-=e.r>15?20:11;if(player.hp<=0){finish(false);return}}}hp.textContent='ЗДОРОВЬЕ '+Math.max(0,Math.ceil(player.hp));status.textContent='ВОЛНА '+wave+'/3 · '+(reload>0?'ПЕРЕЗАРЯДКА':ammo+' ПАТРОНОВ')+' · '+dead+' УБИЙСТВ'}function circle(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1920';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2-player.x,H/2-player.y);ctx.fillStyle='#24323a';ctx.fillRect(-800,-600,1600,1200);ctx.strokeStyle='#46596155';ctx.lineWidth=1;for(var x=-800;x<=800;x+=80){ctx.beginPath();ctx.moveTo(x,-600);ctx.lineTo(x,600);ctx.stroke()}for(var y=-600;y<=600;y+=80){ctx.beginPath();ctx.moveTo(-800,y);ctx.lineTo(800,y);ctx.stroke()}ctx.strokeStyle='#c9a44c';ctx.lineWidth=5;ctx.strokeRect(-740,-540,1480,1080);for(var i=0;i<11;i++){var bx=-700+(i%6)*255,by=-490+Math.floor(i/6)*770;ctx.fillStyle='#48565d';ctx.fillRect(bx,by,80,60);ctx.fillStyle='#9b8842';ctx.fillRect(bx,by+52,80,8)}for(var b of bullets){ctx.strokeStyle='#ffcc78';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.025,b.y-b.vy*.025);ctx.stroke()}for(var e of enemies){circle(e.x+5,e.y+7,e.r,'#0a1218bb');circle(e.x,e.y,e.r,e.hit>0?'#ffe3d7':e.r>15?'#925657':'#718268');circle(e.x+5,e.y-3,3,'#e3584c')}circle(player.x+5,player.y+8,19,'#0b1015aa');ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.a);circle(0,0,17,inv>0?'#e86e64':'#8caeb9');ctx.fillStyle='#d7dde0';ctx.fillRect(10,-6,27,12);ctx.fillStyle='#1b292e';ctx.fillRect(25,-3,22,6);ctx.restore();ctx.restore()}function frame(ms){var dt=Math.min(.04,(ms-last)/1000||0);last=ms;step(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);window.addEventListener('error',function(e){msg.textContent='Ошибка запуска: '+e.message;menu.classList.remove('hide')});})();</script></body></html>
